<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video Hướng Dẫn - Phân Xưởng 1</title>
<link rel="preconnect" href="https://drive.google.com">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --accent:#1565c0;--accent-l:#e3f2fd;--accent-d:#0d47a1;
  --hdr-h:52px;--radius:10px;
}
html,body{min-height:100%;font-family:'Segoe UI',sans-serif;background:#eef0f4}

/* ── HEADER ── */
.hdr{height:var(--hdr-h);background:linear-gradient(135deg,var(--accent-d),var(--accent));
  color:#fff;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;position:sticky;top:0;z-index:200;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.hdr-left h1{font-size:.95rem;font-weight:700;line-height:1.2}
.hdr-left .sub{font-size:.68rem;opacity:.8;margin-top:2px}
.btn-back{color:#fff;opacity:.85;font-size:.78rem;text-decoration:none;
  border:1px solid rgba(255,255,255,.4);padding:6px 10px;border-radius:8px;
  display:inline-flex;align-items:center;gap:4px;transition:.15s;white-space:nowrap}
.btn-back:hover{opacity:1;background:rgba(255,255,255,.2)}

/* ── THANH LỌC ── */
.ctrl{background:#fff;border-bottom:1px solid #e0e0e0;padding:9px 16px;
  position:sticky;top:var(--hdr-h);z-index:190;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.search{width:100%;height:38px;padding:0 12px;border:1.5px solid #ccc;border-radius:9px;
  font-size:16px;font-family:inherit;outline:none}
.search:focus{border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1.5px solid #cfd8dc;background:#fff;border-radius:18px;padding:5px 13px;
  font-size:.76rem;font-weight:700;color:#546e7a;cursor:pointer;transition:.13s;white-space:nowrap}
.chip:hover{border-color:#90a4ae}
.chip.on{background:var(--accent-l);border-color:var(--accent);color:var(--accent-d)}
.chip .n{opacity:.6;font-weight:600}

/* ── DANH SÁCH ── */
.wrap{padding:14px 16px 40px;max-width:1200px;margin:0 auto}
.grp-lbl{font-size:.68rem;font-weight:800;color:#90a4ae;letter-spacing:.09em;
  text-transform:uppercase;margin:16px 0 8px}
.grp-lbl:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}

.card{background:#fff;border:1.5px solid #e3e7ec;border-radius:var(--radius);
  overflow:hidden;cursor:pointer;transition:.15s;display:flex;flex-direction:column}
.card:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(21,101,192,.14);transform:translateY(-2px)}
.thumb{position:relative;width:100%;aspect-ratio:16/9;background:#263238;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:2rem;color:#546e7a;background:#eceff1}
.play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.25);transition:.15s}
.card:hover .play{background:rgba(0,0,0,.4)}
.play span{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.92);
  display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:var(--accent-d);
  padding-left:4px;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.78);color:#fff;
  font-size:.68rem;font-weight:700;padding:2px 6px;border-radius:5px}
.card-bd{padding:9px 11px 11px;flex:1;display:flex;flex-direction:column;gap:3px}
.card-ten{font-size:.86rem;font-weight:800;color:#1a1a1a;line-height:1.25}
.card-mo{font-size:.72rem;color:#78909c;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-nhom{font-size:.64rem;font-weight:800;color:var(--accent);text-transform:uppercase;
  letter-spacing:.04em;margin-top:auto;padding-top:5px}

.empty{text-align:center;color:#90a4ae;padding:50px 20px;font-size:.88rem;line-height:1.6}

/* ── TRÌNH PHÁT ── */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:400;
  opacity:0;pointer-events:none;transition:opacity .2s}
.ov.show{opacity:1;pointer-events:all}
.player{position:fixed;z-index:410;top:50%;left:50%;transform:translate(-50%,-50%) scale(.97);
  width:min(900px,95vw);background:#fff;border-radius:14px;overflow:hidden;
  opacity:0;pointer-events:none;transition:.2s;display:flex;flex-direction:column;max-height:94vh}
.player.show{opacity:1;pointer-events:all;transform:translate(-50%,-50%) scale(1)}
.pl-head{padding:11px 14px;background:linear-gradient(135deg,var(--accent-d),var(--accent));
  color:#fff;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.pl-head h3{font-size:.95rem;font-weight:800;line-height:1.3}
.pl-head .pl-sub{font-size:.7rem;opacity:.85;margin-top:2px}
.pl-close{background:none;border:none;color:#fff;font-size:1.4rem;cursor:pointer;line-height:1;padding:0 4px}
.pl-video{width:100%;aspect-ratio:16/9;background:#000;border:none;display:block}
.pl-foot{padding:9px 14px;border-top:1px solid #eee;display:flex;gap:9px;
  align-items:center;flex-wrap:wrap;font-size:.74rem;color:#78909c}
.pl-foot a{margin-left:auto;color:var(--accent);font-weight:700;text-decoration:none;
  border:1.5px solid var(--accent);padding:5px 11px;border-radius:8px;white-space:nowrap}
.pl-foot a:hover{background:var(--accent-l)}

/* ── ĐIỆN THOẠI ── */
@media(max-width:680px){
  .wrap{padding:12px 10px 40px}
  .grid{grid-template-columns:1fr 1fr;gap:9px}
  .card-ten{font-size:.78rem}
  .card-mo{font-size:.67rem;-webkit-line-clamp:2}
  .card-nhom{font-size:.6rem}
  .play span{width:38px;height:38px;font-size:.9rem}
  .ctrl{padding:8px 10px}
  .player{top:auto;bottom:0;left:0;transform:translateY(100%);width:100%;
    max-height:96vh;border-radius:16px 16px 0 0}
  .player.show{transform:translateY(0)}
  .pl-foot a{margin-left:0;width:100%;text-align:center}
}
/* Chỉ về 1 cột ở máy rất hẹp; 375px (iPhone phổ biến) vẫn giữ 2 cột
   để mỗi màn hình thấy được nhiều video hơn khi danh sách dài */
@media(max-width:330px){ .grid{grid-template-columns:1fr} }
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-left">
    <h1>🎬 Video Hướng Dẫn</h1>
    <div class="sub" id="sub"></div>
  </div>
  <a href="index.html" class="btn-back">← Lịch Ca</a>
</div>

<div class="ctrl">
  <input type="text" class="search" id="q" placeholder="🔍 Tìm theo tên video, mã máy, nội dung..."
         autocomplete="off" data-clear-on-load oninput="render()">
  <div class="chips" id="chips"></div>
</div>

<div class="wrap"><div id="ds"></div></div>

<div class="ov" id="ov" onclick="dong()"></div>
<div class="player" id="player">
  <div class="pl-head">
    <div><h3 id="plTen">—</h3><div class="pl-sub" id="plNhom"></div></div>
    <button class="pl-close" onclick="dong()">✕</button>
  </div>
  <iframe class="pl-video" id="plFrame" allow="autoplay; fullscreen" allowfullscreen></iframe>
  <div class="pl-foot">
    <span id="plMo"></span>
    <a id="plDrive" target="_blank" rel="noopener">Mở trong Drive ↗</a>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// DANH SÁCH VIDEO
// ═══════════════════════════════════════════════════════════════
// CÁCH THÊM VIDEO:
//
// 1) Tải video lên Google Drive.
//
// 2) Bấm chuột phải vào video -> Chia sẻ -> đổi "Bị hạn chế" thành
//    "Bất kỳ ai có đường liên kết". BẮT BUỘC, nếu không nhân viên mở ra
//    chỉ thấy màn hình đòi đăng nhập Google.
//
// 3) Copy đường liên kết, dạng:
//      https://drive.google.com/file/d/1AbC...XyZ/view?usp=sharing
//                                      └──────────┘
//    Đoạn giữa /d/ và /view chính là id. Dán vào ô id bên dưới.
//
// 4) Thêm một dòng vào danh sách, theo mẫu:
//      { id:'1AbC...XyZ', ten:'Tên video', nhom:'Nhóm', mota:'Mô tả ngắn', thoiluong:'3:20' },
//    Trong đó nhom dùng để gom nhóm và lọc; thoiluong có thể bỏ trống ''.
//
// Muốn đổi thứ tự hiển thị thì đổi thứ tự dòng trong danh sách này.
// ═══════════════════════════════════════════════════════════════
const VIDEOS = [
  { id:'1x8xihpv8zu4nKyWNX8KIdxA-cRzF8cqb',
    ten:'Hướng dẫn sử dụng tem trạng thái',
    nhom:'Hướng dẫn công việc',
    mota:'', thoiluong:'' },
];

// ═══════════════════════════════════════════════════════════════
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Drive: link nhúng và link ảnh đại diện đều dựng từ id
const linkNhung = id => `https://drive.google.com/file/d/${id}/preview`;
const linkMo    = id => `https://drive.google.com/file/d/${id}/view`;
const linkAnh   = id => `https://drive.google.com/thumbnail?id=${id}&sz=w480`;

let nhomDangChon = '';

function cacNhom(){
  const m = new Map();
  VIDEOS.forEach(v => m.set(v.nhom || 'Khác', (m.get(v.nhom || 'Khác') || 0) + 1));
  return [...m.entries()];
}

function veChips(){
  const box = document.getElementById('chips');
  const nhom = cacNhom();
  box.innerHTML = '';
  const them = (ten, nhan, so) => {
    const b = document.createElement('button');
    b.className = 'chip' + (nhomDangChon === ten ? ' on' : '');
    b.innerHTML = `${esc(nhan)} <span class="n">${so}</span>`;
    b.onclick = () => { nhomDangChon = (nhomDangChon === ten ? '' : ten); render(); };
    box.appendChild(b);
  };
  them('', 'Tất cả', VIDEOS.length);
  nhom.forEach(([ten, so]) => them(ten, ten, so));
}

function render(){
  veChips();
  const q = document.getElementById('q').value.toLowerCase().trim();
  const loc = VIDEOS.filter(v => {
    if(nhomDangChon && (v.nhom || 'Khác') !== nhomDangChon) return false;
    if(!q) return true;
    return [v.ten, v.mota, v.nhom].join(' ').toLowerCase().includes(q);
  });

  document.getElementById('sub').textContent =
    `${VIDEOS.length} video · ${cacNhom().length} nhóm`;

  const ds = document.getElementById('ds');
  if(!loc.length){
    ds.innerHTML = VIDEOS.length
      ? '<div class="empty">Không tìm thấy video nào khớp.</div>'
      : '<div class="empty">Chưa có video nào.<br>Xem hướng dẫn thêm video ở đầu phần mã nguồn của trang.</div>';
    return;
  }

  // gom theo nhóm, giữ nguyên thứ tự trong danh sách
  const theoNhom = new Map();
  loc.forEach(v => {
    const n = v.nhom || 'Khác';
    if(!theoNhom.has(n)) theoNhom.set(n, []);
    theoNhom.get(n).push(v);
  });

  let h = '';
  theoNhom.forEach((list, nhom) => {
    h += `<div class="grp-lbl">${esc(nhom)} · ${list.length}</div><div class="grid">`;
    list.forEach(v => {
      const i = VIDEOS.indexOf(v);
      const anh = v.id
        ? `<img src="${linkAnh(v.id)}" alt="" loading="lazy" onerror="this.style.display='none'">`
        : `<div class="noimg">🎬</div>`;
      h += `<div class="card" onclick="mo(${i})">
        <div class="thumb">${anh}
          <div class="play"><span>▶</span></div>
          ${v.thoiluong ? `<div class="dur">${esc(v.thoiluong)}</div>` : ''}
        </div>
        <div class="card-bd">
          <div class="card-ten">${esc(v.ten)}</div>
          ${v.mota ? `<div class="card-mo">${esc(v.mota)}</div>` : ''}
          <div class="card-nhom">${esc(v.nhom || 'Khác')}</div>
        </div>
      </div>`;
    });
    h += '</div>';
  });
  ds.innerHTML = h;
}

function mo(i){
  const v = VIDEOS[i];
  if(!v.id){
    alert('Video này chưa gắn link Google Drive.\n\nXem hướng dẫn thêm video ở đầu phần mã nguồn của trang.');
    return;
  }
  document.getElementById('plTen').textContent  = v.ten;
  document.getElementById('plNhom').textContent = (v.nhom || 'Khác') + (v.thoiluong ? ' · ' + v.thoiluong : '');
  document.getElementById('plMo').textContent   = v.mota || '';
  document.getElementById('plDrive').href       = linkMo(v.id);
  document.getElementById('plFrame').src        = linkNhung(v.id);
  document.getElementById('ov').classList.add('show');
  document.getElementById('player').classList.add('show');
}

function dong(){
  document.getElementById('player').classList.remove('show');
  document.getElementById('ov').classList.remove('show');
  // gỡ src để video ngừng phát, không thì tiếng vẫn chạy sau khi đóng
  document.getElementById('plFrame').src = '';
}

addEventListener('keydown', e => { if(e.key === 'Escape') dong(); });

// Ô tìm kiếm luôn trống khi tải trang (xem ghi chú ở nhansu-ca.html)
function clearSearchBoxes(){
  document.querySelectorAll('input[data-clear-on-load]').forEach(el => {
    el.value = '';
    if(el.dataset.armed){ el.setAttribute('readonly',''); return; }
    el.dataset.armed = '1';
    el.setAttribute('readonly','');
    const unlock = () => el.removeAttribute('readonly');
    el.addEventListener('pointerdown', unlock);
    el.addEventListener('touchstart', unlock, {passive:true});
    el.addEventListener('focus', unlock);
    el.addEventListener('keydown', unlock);
  });
}
clearSearchBoxes();
addEventListener('DOMContentLoaded', clearSearchBoxes);
addEventListener('pageshow', clearSearchBoxes);

render();
</script>
</body>
</html>
